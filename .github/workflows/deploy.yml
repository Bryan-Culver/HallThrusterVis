name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hall-eff-thr-vis
    steps:
      - uses: actions/checkout@v7
      - name: Fail if 3D assets are committed to the app
        working-directory: .
        run: |
          if git ls-files 'hall-eff-thr-vis/*' | grep -iE '\.(obj|mtl|glb|gltf|stl|fbx)$'; then
            echo "3D assets must be hosted externally (see README)"; exit 1
          fi
      # pnpm version comes from "packageManager" in hall-eff-thr-vis/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hall-eff-thr-vis/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hall-eff-thr-vis/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          VITE_MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: hall-eff-thr-vis/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
